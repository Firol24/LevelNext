name: LEVEL NEXT — latest TikTok upload
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/update_latest_tiktok.py'
      - '.github/workflows/latest-tiktok.yml'
  workflow_dispatch:
  schedule:
    - cron: "31 */2 * * *"
permissions:
  contents: write
concurrency:
  group: level-next-social-feed-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: Resolve newest public TikTok post
        run: python scripts/update_latest_tiktok.py
      - name: Publish latest TikTok data
        run: |
          if git diff --quiet -- data/latest_tiktok.json; then
            echo "Dane najnowszego TikToka są aktualne."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_tiktok.json
          git commit -m "Update latest TikTok upload"
          git push
