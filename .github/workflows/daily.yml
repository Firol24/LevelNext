name: LEVEL NEXT DAILY — free RSS edition
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - 'scripts/generate_daily.py'
      - 'data/editorial.json'
  workflow_dispatch:
  schedule:
    # 08:00, 11:00, 14:00, 17:00 i 20:00 czasu polskiego.
    # GitHub cron działa w UTC; podajemy oba warianty DST/CET, a generator filtruje lokalne godziny.
    - cron: "0 6,7,9,10,12,13,15,16,18,19 * * *"
permissions:
  contents: write
concurrency:
  group: level-next-daily-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate RSS-only edition (no API key)
        env:
          FORCE_PUBLISH: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: python scripts/generate_daily.py
      - name: Publish to GitHub Pages
        if: success()
        run: |
          if git diff --quiet; then
            echo "Brak zmian do opublikowania."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json archive/
          git commit -m "Publish free RSS-only LEVEL NEXT DAILY edition"
          git push
# Schedule note: RSS refresh runs five times daily at 08:00, 11:00, 14:00, 17:00 and 20:00 Europe/Warsaw.
