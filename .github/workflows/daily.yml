name: LEVEL NEXT DAILY — free RSS edition
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - 'scripts/generate_daily.py'
      - 'data/editorial.json'
  workflow_dispatch:
  schedule:
    # Główne uruchomienie 08:00 PL (06:00 UTC latem / 07:00 UTC zimą).
    - cron: "0 6,7 * * *"
    # Zapasowe uruchomienie 08:10 PL; generator pomija duplikat, jeśli wydanie już istnieje.
    - cron: "10 6,7 * * *"
permissions:
  contents: write
concurrency:
  group: level-next-daily-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate RSS-only edition (no API key)
        env:
          FORCE_PUBLISH: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: python scripts/generate_daily.py
      - name: Publish to GitHub Pages
        if: success()
        run: |
          if git diff --quiet; then
            echo "Brak zmian do opublikowania."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json archive/
          git commit -m "Publish free RSS-only LEVEL NEXT DAILY edition"
          git push
# Recovery note: the 08:00 schedule was missed on 2026-11-03; an 08:10 fallback is now configured.
