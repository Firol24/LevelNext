name: LEVEL NEXT DAILY — free RSS edition
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - 'scripts/generate_daily.py'
      - 'data/editorial.json'
  workflow_dispatch:
  schedule:
    # Minuta 17 omija największy tłok harmonogramu GitHub Actions na początku godziny.
    # Pary UTC pokrywają CEST i CET; generator filtruje właściwą godzinę w Europe/Warsaw.
    - cron: "17 6,7 * * *"
    - cron: "17 9,10 * * *"
    - cron: "17 12,13 * * *"
    - cron: "17 15,16 * * *"
    - cron: "17 18,19 * * *"
permissions:
  contents: write
concurrency:
  group: level-next-daily-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate RSS-only edition (no API key)
        env:
          FORCE_PUBLISH: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: python scripts/generate_daily.py
      - name: Publish to GitHub Pages (retry concurrent pushes)
        if: success()
        env:
          FORCE_PUBLISH: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git add data/daily.json archive/
            if git diff --cached --quiet; then
              echo "Brak zmian do opublikowania."
              exit 0
            fi
            git commit -m "Publish free RSS-only LEVEL NEXT DAILY edition"
            if git push; then
              exit 0
            fi
            echo "Konflikt publikacji (próba $attempt). Pobieram aktualny main i ponawiam generowanie."
            git reset --hard HEAD^
            git fetch origin main
            git reset --hard origin/main
            python scripts/generate_daily.py
            sleep 4
          done
          echo "Nie udało się opublikować wydania po 4 próbach."
          exit 1
# Schedule note: publikacje około 08:17, 11:17, 14:17, 17:17 i 20:17 czasu Europe/Warsaw.
