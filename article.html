<style>
:root{--ink:#100b17;--night:#08040e;--purple:#6a0dad;--deep:#260044;--yellow:#fff200;--paper:#f1eedf;--muted:#655d69;--line:#c9c0a9;--mono:'IBM Plex Mono',monospace;--sans:'Space Grotesk',sans-serif;--serif:'DM Serif Display',Georgia,serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#341052 0,var(--night) 52%);color:var(--paper);font-family:var(--sans);min-height:100vh}a{color:inherit}
header{max-width:1180px;margin:auto;padding:20px 24px;border-bottom:1px solid #ffffff35;font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase}header a{color:var(--yellow);text-decoration:none}
main{max-width:920px;margin:32px auto 70px;padding:0 16px}.paper{background:var(--paper);color:var(--ink);padding:clamp(22px,5vw,60px);border-top:7px solid var(--yellow);box-shadow:0 18px 70px #0009}
.kicker{font:700 11px var(--mono);letter-spacing:.12em;color:var(--purple);text-transform:uppercase}.date{font:10px var(--mono);color:var(--muted);text-transform:uppercase;margin-top:12px}
h1{font:clamp(38px,7vw,68px)/.98 var(--serif);letter-spacing:-.035em;margin:18px 0}.dek{font:19px/1.55 var(--sans);color:#514956;border-bottom:1px solid var(--line);padding-bottom:24px}
.hero{width:100%;max-height:460px;object-fit:cover;margin:26px 0}.body{font:18px/1.85 var(--sans);max-width:720px;margin:auto}.body p{margin:0 0 1.4em}.byline{font:11px var(--mono);color:var(--muted);text-transform:uppercase;margin-top:20px}
.footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font:10px var(--mono);text-transform:uppercase}.footer a{color:var(--purple)}
.error{padding:25px;border:1px dashed #a89db0;color:#655d69;font:12px/1.6 var(--mono)}
</style>

<body><header><a href="daily.html">← LEVEL NEXT DAILY</a>　/　PUBLICYSTYKA</header>
<main><article class="paper" id="article"><div class="error">Wczytywanie felietonu…</div></article></main>
<script>
(()=>{const root=document.getElementById('article');const safeUrl=v=>{try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
async function load(){try{
const params=new URLSearchParams(location.search);const id=params.get('id');const issueDate=params.get('date');
if(!id)throw Error('Nie wskazano publikacji.');
let item=null;let isManual=false;
try{const r=await fetch('data/manual-news.json?ts='+Date.now(),{cache:'no-store'});if(r.ok){const data=await r.json();for(const entries of Object.values(data)){if(Array.isArray(entries)){item=entries.find(x=>x.articleSlug===id);if(item){isManual=true;break;}}}}}catch{}
if(!item){
 const validDate=issueDate&&/^\d{4}-\d{2}-\d{2}$/.test(issueDate);
 const path=validDate?'archive/'+issueDate+'.json':'data/daily.json';
 const r=await fetch(path+'?ts='+Date.now(),{cache:'no-store'});
 if(!r.ok)throw Error('Nie udało się pobrać wydania z archiwum.');
 const issue=await r.json();item=(issue.news||[]).find(x=>x.articleSlug===id);
}
if(!item)throw Error('Nie znaleziono tej publikacji w wydaniu.');
document.title=item.title+' — LEVEL NEXT DAILY';
const date=item.publishedAt?new Date(item.publishedAt):null;
const dateText=date&&!Number.isNaN(date.getTime())?date.toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'}):'LEVEL NEXT / REDAKCJA';
const label=isManual?'LEVEL NEXT / FELIETON':'LEVEL NEXT DAILY / SKRÓT REDAKCYJNY';
root.replaceChildren(el('div','kicker',label),el('h1','',item.title),el('p','dek',item.summary||''));
root.append(el('div','date',dateText+' · '+(item.sourceName||'LEVEL NEXT / REDAKCJA')));
if(item.imageUrl){const img=el('img','hero');img.src=safeUrl(item.imageUrl);img.alt='';img.onerror=()=>img.remove();root.append(img);}
const body=el('div','body');
(item.articleBody||item.summary||'').split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean).forEach(p=>body.append(el('p','',p)));
root.append(body);
if(!isManual)root.append(el('p','byline','To skrót przygotowany na podstawie opisu udostępnionego przez źródło. Nie jest to pełny tekst oryginalnej publikacji.'));
const footer=el('div','footer');const back=el('a','', 'Wróć do wydania ↗');back.href=issueDate?'daily.html?date='+encodeURIComponent(issueDate):'daily.html';footer.append(back);
if(item.sourceUrl){const src=el('a','','　Oryginalny materiał ↗');src.href=safeUrl(item.sourceUrl);src.target='_blank';src.rel='noopener noreferrer';footer.append(src);}
root.append(footer);
}catch(e){root.replaceChildren(el('div','error',e.message));}}
load();})();
</script><script src="site.js?v=19"></script>
<script src="chat.js?v=2"></script></body></html>
